name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Run unit tests
        run: npm test

  package:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="inconnu-boy-apk-builder-${GITHUB_REF_NAME}/" --output="inconnu-boy-apk-builder-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
          sha256sum "inconnu-boy-apk-builder-${GITHUB_REF_NAME}.tar.gz" > "inconnu-boy-apk-builder-${GITHUB_REF_NAME}.tar.gz.sha256"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes "inconnu-boy-apk-builder-${GITHUB_REF_NAME}.tar.gz" "inconnu-boy-apk-builder-${GITHUB_REF_NAME}.tar.gz.sha256"

  image:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
